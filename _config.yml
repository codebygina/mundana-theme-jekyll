authors:
    Harshal:
      name:           Harshal
      site:           harshal4412.github.io
      avatar:         C:\Users\Harshal Rana\Desktop\portfolio-website\media\ProfileImg.jpg
      bio:            "Hi, I am Harshal, the author of ThatGuyLovesTech, and here I share my academic journey, projects, and insights. I hope you like it!"
